<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicios — CASTAMOTO</title>
<base href="/proyectos/castamotos/">
<link rel="stylesheet" href="frontend/css/main.css">
</head>
<body>

<div id="app-header"></div>

<main class="container">
  <nav class="breadcrumbs" aria-label="Ruta de navegación">
    <a href=".">Inicio</a> › <span aria-current="page">Servicios</span>
  </nav>

  <div class="catalog-layout mt-16">
    <aside class="filters-sidebar">
      <h2>Filtrar</h2>
      <form id="service-filter-form">
        <div class="form-group">
          <label class="sr-only" for="filter-service-search">Buscar</label>
          <input id="filter-service-search" class="form-control" type="search" placeholder="Buscar servicios...">
        </div>
        <div class="form-group">
          <label for="filter-service-category">Categoría</label>
          <select id="filter-service-category" class="form-control"><option value="">Todas</option></select>
        </div>
        <div class="form-group">
          <label for="filter-service-location">Ubicación</label>
          <input id="filter-service-location" class="form-control" placeholder="Ciudad">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Aplicar filtros</button>
      </form>
    </aside>

    <div>
      <h1 class="section__title" style="font-size:1.2rem;margin-top:0;">Servicios</h1>
      <div id="services-results"><p class="loading-state">Cargando servicios…</p></div>
    </div>
  </div>
</main>

<div id="app-footer"></div>

<script src="frontend/js/utils/helpers.js"></script>
<script src="frontend/js/services/apiService.js"></script>
<script src="frontend/js/services/authService.js"></script>
<script src="frontend/js/services/catalogService.js"></script>
<script src="frontend/js/services/cartService.js"></script>
<script src="frontend/js/components/layout.js"></script>
<script src="frontend/js/components/cards.js"></script>
<script src="frontend/js/pages/servicios.js"></script>
</body>
</html>

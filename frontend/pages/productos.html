<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — CASTAMOTO</title>
<base href="/proyectos/castamotos/">
<link rel="stylesheet" href="frontend/css/main.css">
</head>
<body>

<div id="app-header"></div>

<main class="container">
  <h1 class="section__title mt-16">Productos</h1>

  <div class="filters-bar">
    <select id="filter-category" aria-label="Categoría"><option value="">Todas las categorías</option></select>
    <select id="filter-brand" aria-label="Marca"><option value="">Todas las marcas</option></select>
    <input id="filter-min-price" type="number" placeholder="Precio mínimo" aria-label="Precio mínimo">
    <input id="filter-max-price" type="number" placeholder="Precio máximo" aria-label="Precio máximo">
    <select id="filter-availability" aria-label="Disponibilidad">
      <option value="">Cualquier disponibilidad</option>
      <option value="disponible">Disponible</option>
      <option value="ultimas_unidades">Últimas unidades</option>
      <option value="agotado">Agotado</option>
    </select>
    <select id="filter-sort" aria-label="Ordenar por">
      <option value="newest">Más recientes</option>
      <option value="relevancia">Relevancia</option>
      <option value="price_asc">Precio: menor a mayor</option>
      <option value="price_desc">Precio: mayor a menor</option>
      <option value="name">Nombre A-Z</option>
      <option value="rating">Mejor calificados</option>
    </select>
    <form id="filter-search-form" style="display:flex;gap:4px;flex:1;min-width:200px;">
      <label class="sr-only" for="filter-search-input">Buscar</label>
      <input class="form-control" id="filter-search-input" type="search" placeholder="Buscar en productos...">
      <button class="btn btn-secondary" type="submit">Buscar</button>
    </form>
  </div>

  <p id="products-count" style="color:var(--gris-texto);font-size:0.85rem;"></p>
  <div id="products-results"><p class="loading-state">Cargando productos…</p></div>
  <div class="text-center mt-16" id="products-pagination"></div>
</main>

<div id="app-footer"></div>

<script src="frontend/js/utils/helpers.js"></script>
<script src="frontend/js/services/apiService.js"></script>
<script src="frontend/js/services/authService.js"></script>
<script src="frontend/js/services/catalogService.js"></script>
<script src="frontend/js/services/cartService.js"></script>
<script src="frontend/js/components/layout.js"></script>
<script src="frontend/js/components/cards.js"></script>
<script src="frontend/js/pages/productos.js"></script>
</body>
</html>
